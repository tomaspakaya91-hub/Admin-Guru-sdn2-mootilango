<style>
:root{
  --navy:#0f294a;
  --navy-light:#1a3f6e;
  --blue:#2563eb;
  --blue-soft:#eff6ff;
  --gold:#d97706;
  --gold-soft:#fef3c7;
  --bg:#f1f5f9;
  --surface:#ffffff;
  --ink:#1e293b;
  --muted:#64748b;
  --line:#e2e8f0;
  --green:#059669;
  --green-soft:#ecfdf5;
  --red:#dc2626;
  --red-soft:#fef2f2;
  --shadow:0 4px 20px -2px rgba(15,41,74,0.06);
  --shadow-lg:0 12px 32px -4px rgba(15,41,74,0.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font:14px/1.6 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
header{
  height:72px;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 16px rgba(15,41,74,0.15);
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  border:1px solid rgba(255,255,255,0.25);
  display:grid;place-items:center;font-size:22px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
.brand strong{display:block;font-size:16px;letter-spacing:.3px;font-weight:800}
.brand small{color:#cbd5e1;font-size:12px}
.header-right{display:flex;align-items:center;gap:12px;font-size:12px;color:#e2e8f0}
.pill-badge{
  background:rgba(255,255,255,0.14);
  padding:6px 12px;border-radius:99px;
  border:1px solid rgba(255,255,255,0.18);
  font-weight:600;
}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 72px)}
aside{
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:16px 14px;
  position:sticky;top:72px;height:calc(100vh - 72px);
  overflow-y:auto;
}
.nav-label{
  font-size:10px;font-weight:800;letter-spacing:1.1px;
  color:#94a3b8;padding:16px 12px 6px;text-transform:uppercase;
}
nav button{
  width:100%;border:0;background:transparent;text-align:left;
  padding:10px 14px;border-radius:10px;color:#475569;
  cursor:pointer;font:inherit;font-size:13.5px;font-weight:500;
  display:flex;gap:11px;align-items:center;margin:2px 0;
  transition:all .18s ease;
}
nav button:hover{background:#f8fafc;color:var(--navy);transform:translateX(2px)}
nav button.active{
  background:linear-gradient(90deg,var(--blue-soft),#f8fafc);
  color:var(--blue);font-weight:700;
  box-shadow:inset 3px 0 0 var(--blue);
}
nav button .ico{font-size:16px;width:20px;text-align:center}
main{padding:28px 32px;max-width:1440px;width:100%;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
h1{font-size:26px;font-weight:800;margin:0 0 4px;color:var(--navy);letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13.5px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:20px;box-shadow:var(--shadow);
}
.stat-card{position:relative;overflow:hidden;transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-ico{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;
}
.stat{font-size:30px;font-weight:800;color:var(--navy);margin:10px 0 2px;line-height:1.1}
.stat-label{color:var(--muted);font-size:12.5px;font-weight:600}
.section{margin-top:22px}
.section h2{font-size:17px;font-weight:700;color:var(--navy);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:9px 15px;border-radius:10px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;
}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,0.25)}
.btn.primary:hover{background:#1d4ed8}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#fecaca;background:#fff}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{
  background:#f8fafc;color:#475569;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;
}
tr:hover td{background:#f8fafc}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;
  font:inherit;font-size:13.5px;background:#fff;color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px}
.field{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.notice{
  background:linear-gradient(to right,#fffbeb,#fef3c7);
  border:1px solid #fde68a;padding:14px 16px;border-radius:12px;
  color:#92400e;font-size:13px;display:flex;gap:10px;align-items:flex-start;
}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.menu-tile{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:18px;cursor:pointer;text-align:left;transition:all .18s;
  box-shadow:var(--shadow);
}
.menu-tile:hover{border-color:#93c5fd;transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.menu-tile .tile-ico{font-size:24px;margin-bottom:8px;display:inline-block}
.menu-tile b{display:block;font-size:14.5px;color:var(--navy);margin-bottom:4px}
.menu-tile small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}
.tag{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;
  font-size:11px;font-weight:700;
}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.gray{background:#f1f5f9;color:#475569}

/* Bar chart visual */
.bar-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.bar-label{width:70px;font-weight:700;font-size:12.5px;color:var(--navy)}
.bar-track{flex:1;height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),#38bdf8);border-radius:99px}
.bar-val{width:65px;text-align:right;font-size:12.5px;font-weight:700;color:var(--muted)}

/* CP Card */
.cp-box{
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#f8fafc;
}
.cp-box h4{margin:0 0 6px;color:var(--navy);font-size:14px}
.cp-box p{margin:0;font-size:13px;color:#334155;line-height:1.6}

/* Modal */
.modal{
  position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.modal.show{display:flex}
.modal-box{
  background:#fff;border-radius:18px;padding:24px;width:min(680px,100%);
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line);
}
.modal-head h2{margin:0;font-size:18px;color:var(--navy)}

/* Tabs */
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.tab-btn{
  padding:8px 14px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;
}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  aside{position:relative;top:0;height:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
  nav{display:flex;overflow-x:auto;gap:4px}
  nav button{white-space:nowrap;width:auto}
  .nav-label{display:none}
  main{padding:20px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
}
@media(max-width:600px){
  header{padding:0 16px}
  .header-right{display:none}
  .menu-grid,.form-grid,.form-grid-3{grid-template-columns:1fr}
  .page-head{flex-direction:column}
}
@media print{
  header,aside,.actions,.btn,.no-print{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:100%}
  .card,.table-wrap{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

};

function buildStudentRows(list) {
  if (!list.length) return `<tr><td colspan="9" class="empty">Tidak ada data peserta didik yang sesuai filter.</td></tr>`;
  return list.map((s, idx) => `
    <tr>
      <td>${idx + 1}</td>
      <td>
        <b>${esc(s.name)}</b><br>
        <small class="sub">${esc(s.alamat || "-")} • ${esc(s.kelurahan || "")}</small>
      </td>
      <td><span class="tag gray">${esc(s.nipd || "-")}</span><br><small class="sub">${esc(s.nisn || "-")}</small></td>
      <td><span class="tag ${s.gender==='L'?'blue':'gold'}">${esc(s.gender)}</span></td>
      <td><b>Kelas ${esc(s.classroom)}</b></td>
      <td>${esc(s.tempatLahir)},<br><small class="sub">${esc(s.tanggalLahir)}</small></td>
      <td><small>A: ${esc(s.ayah || "-")}<br>I: ${esc(s.ibu || "-")}</small></td>
      <td>${s.layakPIP === 'Ya' ? '<span class="tag green">Layak PIP</span>' : '<span class="tag gray">Tidak</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn sm" onclick="viewStudent(${s.id})">Detail</button>
        <button class="btn sm" onclick="openStudentForm(${s.id})">Edit</button>
        <button class="btn sm danger" onclick="deleteStudent(${s.id})">Hapus</button>
      </td>
    </tr>
  `).join("");
}

function filterStudentTable() {
  const c = $("#fClass")?.value || "";
  const pip = $("#fPIP")?.value || "";
  const q = ($("#fSearch")?.value || "").toLowerCase();
  const filtered = store.get("students", []).filter(s => {
    const matchC = !c || String(s.classroom) === c;
    const matchP = !pip || s.layakPIP === pip;
    const hay = `${s.name} ${s.nisn} ${s.nipd} ${s.nik} ${s.ayah} ${s.ibu} ${s.alamat}`.toLowerCase();
    return matchC && matchP && hay.includes(q);
  });
  $("#studentTbody").innerHTML = buildStudentRows(filtered);
}

function saveStudent(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const list = store.get("students", []);
  const obj = {
    id: id || Date.now(),
    name: fd.get("name").toUpperCase(),
    nipd: fd.get("nipd"),
    nisn: fd.get("nisn"),
    nik: fd.get("nik"),
    classroom: fd.get("classroom"),
    gender: fd.get("gender"),
    layakPIP: fd.get("layakPIP"),
    tempatLahir: fd.get("tempatLahir"),
    tanggalLahir: fd.get("tanggalLahir"),
    ayah: fd.get("ayah"),
    ibu: fd.get("ibu"),
    alamat: fd.get("alamat"),
    kelurahan: "Desa/Kel. Helumo",
    hp: fd.get("hp"),
    agama: "Islam",
    sekolahAsal: ""
  };
  if (id) {
    const idx = list.findIndex(x => x.id === id);
    if (idx > -1) list[idx] = {...list[idx], ...obj};
  } else {
    list.push(obj);
  }
  store.set("students", list);
  closeModal();
  render();
}

function deleteStudent(id) {
  if (!confirm("Hapus data peserta didik ini?")) return;
  store.set("students", store.get("students", []).filter(x => x.id !== id));
  render();
}

        <thead><tr><th>No</th><th>Komponen Administrasi Pembelajaran</th><th>Status Kesiapan</th></tr></thead>
        <tbody>
          ${items.map((it, i) => `
            <tr>
              <td>${i+1}</td>
              <td><b>${it[0]}</b></td>
              <td>${it[1] ? '<span class="tag green">✔ Tersedia</span>' : '<span class="tag gold">⏳ Belum Diisi</span>'}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderSettings() {
  return `
    ${pageHeader("Pengaturan & Pencadangan Data", "Kelola cadangan data JSON perangkat Anda.")}
    <div class="card">
      <h2>💾 Backup & Reset Data Lokal</h2>
      <p class="sub">Seluruh 97 data siswa, 9 data PTK, serta catatan presensi, nilai, dan perangkat ajar tersimpan aman di penyimpanan browser perangkat ini.</p>
      <div class="actions" style="margin-top:14px">
        <button class="btn primary" onclick="backupJSON()">📥 Unduh Backup Lengkap (.JSON)</button>
        <button class="btn danger" onclick="resetDefault()">🔄 Kembalikan Data Awal Sekolah</button>
      </div>
    </div>
  `;
}

function backupJSON() {
  const payload = {
    school: SCHOOL,
    exportedAt: new Date().toISOString(),
    students: store.get("students", []),
    staff: store.get("staff", []),
    tp: store.get("tp", []),
    docs: store.get("docs", []),
    attendance: store.get("attendance", []),
    grades: store.get("grades", []),
    journals: store.get("journals", [])
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "backup_admin_guru_sdn2_mootilango.json";
  a.click();
}

function resetDefault() {
  if (!confirm("Kembalikan database ke data awal 97 siswa dan 9 PTK SD Negeri 2 Mootilango?")) return;
  store.set("students", INITIAL_STUDENTS);
  store.set("staff", INITIAL_STAFF);
  render();
}

function exportCSV(kind) {
  const arr = store.get(kind, []);
  if (!arr.length) return alert("Belum ada data untuk diekspor.");
  const keys = Object.keys(arr[0]);
  const csv = [keys, ...arr.map(o => keys.map(k => o[k]))]
    .map(r => r.map(v => '"' + String(v??"").replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${kind}_sdn2_mootilango.csv`;
  a.click();
}

// ============================================================================
// 12. ROUTING NAVIGASI
// ============================================================================
function render() {
  const map = {
    dashboard: renderDashboard,
    students: renderStudents,
    staff: renderStaff,
    curriculum: renderCurriculum,
    planning: () => renderDocManager("planning", "Prota, Promes & Silabus", "Perencanaan program tahunan, semester, dan alur silabus."),
    module: () => renderDocManager("module", "Modul Ajar / RPP", "Perangkat ajar terintegrasi pendekatan pembelajaran mendalam."),
    lkpd: () => renderDocManager("lkpd", "Lembar Kerja Peserta Didik (LKPD)", "Lembar aktivitas belajar murid per pertemuan."),
    questions: () => renderDocManager("questions", "Bank Soal & Asesmen", "Kumpulan kisi-kisi, soal harian, STS, dan SAS."),
    templates: () => renderDocManager("templates", "Template Administrasi Kelas", "Buku induk, jadwal pelajaran, denah kelas, dan inventaris."),
    attendance: renderAttendance,
    grades: renderGrades,
    journal: renderJournals,
    supervision: renderSupervision,
    settings: renderSettings
  };
  $("#content").innerHTML = (map[currentPage] || renderDashboard)();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.page === currentPage));
}

function go(p) {
  currentPage = p;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

$("#nav").addEventListener("click", e => {
  const btn = e.target.closest("button[data-page]");
  if (btn) go(btn.dataset.page);
});

render();
</script>
</body>
